[package]
name = "bt-battery-bar"
version = "0.1.3"
edition = "2024"
description = "轻量级 Windows 任务栏蓝牙设备电量显示条（Rust / 原生 Win32 + WinRT GATT）"
license = "MIT"

[dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_GdiPlus",
  "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_HiDpi",
  "Devices_Bluetooth",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Enumeration",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
